apiVersion: digital-employee/v1
kind: DigitalEmployee
metadata:
  id: de_creator_multichannel_rewriter
  name: 多平台分发改写师
  alias: null
  repo: de-creator-multichannel-rewriter
  card_no: 5.4-5
  group: creator
  group_label: 自媒体从业者
  phase: P1 二期
  complexity: M（主动放弃代发连接器后实际偏 S-M），总估 5-8 人日
  score: 21
  price: ¥20-50/月；**建议捆绑入组合包，不单独售卖**（面临蚁小二/易媒助手成熟竞争，据 R2 调研）
  channels:
  - GitHub（必备基础渠道）
  - 小红书
  - Coze扣子商店
  - Dify Marketplace
  - 豆包工作
  license: Apache-2.0
  version: 1.0.0
spec:
  positioning: 一稿多投不是搬运，而是逐平台重写+合规适配的分发参谋
  users: 矩阵运营者与全平台创作者（日均 3h+ 耗在分发上的人群，据 R2 调研）
  boundary: 做：分平台风格改写、合规适配、发布排期与核对；不做：自动登录代发（账号风控红线）、跨平台抄袭洗稿
  kpi: 分发环节耗时从 1-3h 压缩至 ≤30 分钟；逐平台合规校验覆盖率 100%；漏发/错发事故归零
  roi_summary: 月省 30-60h 折 ¥900-1800，即便捆绑定价 ROI 仍 >10 倍
  demand_refs:
  - D11
  - D26
  demand_support: 充分
  demand_evidence: 低-中
runtime:
  system_prompt: persona/system-prompt.md
  boundary: persona/boundary.md
  kpi: persona/kpi.md
deliverables:
  skills:
  - slug: xhs-note-layout
    name: 小红书笔记排版
    kind: private
    path: skills/xhs-note-layout
    version: 1.0.0
    maturity: contract-complete
  workflows:
  - slug: wf-creator-rewrite-style
    name: 一稿多投改写
    path: workflows/wf-creator-rewrite-style
    version: 1.0.0
    phase: P1
    calls:
    - platform-format-adapter
    - xhs-note-layout
    - colloquial-rewrite
  - slug: wf-creator-rewrite-compliance
    name: 平台合规适配
    path: workflows/wf-creator-rewrite-compliance
    version: 1.0.0
    phase: P1
    calls:
    - compliance-word-scan
    - title-generator
  - slug: wf-creator-rewrite-schedule
    name: 定时发布排期表
    path: workflows/wf-creator-rewrite-schedule
    version: 1.0.0
    phase: P1
    calls:
    - scheduled-dispatch
  - slug: wf-creator-rewrite-publish-check
    name: 发布状态核对清单
    path: workflows/wf-creator-rewrite-publish-check
    version: 1.0.0
    phase: P1
    calls:
    - scheduled-dispatch
  knowledge_base: kb/
  connectors: connectors/bindings.yaml
external_dependencies:
- repo: agent-skills-core
  version: 1.0.0
  skills:
  - colloquial-rewrite
  - compliance-word-scan
  - platform-format-adapter
  - scheduled-dispatch
  - title-generator
  resolution: external
spec_only_dependencies: []
